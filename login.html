<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            background-image: url("images/res4.jpg");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card 
        {
            background: lavenderblush;
            width: 150%;
            max-width: 700px;
            padding: 35px;
            border-radius:20px;
            box-shadow: 0 15px 35px blue;
            animation: zoomIn 3s ease-in-out;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 800;
        }

        .form-control {
            border-radius: 10px;
            transition: all 0.3s ease-out;
        }

        .form-control:focus {
            box-shadow: 0 0 8px palevioletred;
            border-color: skyblue;
        }

        .btn-login {
            background: plum;
            color: purple;
            border: double;
            padding: 10px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: pink;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px greenyellow;
        }

        .links {
            text-align: center;
            margin-top: 15px;
        }

        .links a {
            text-decoration: none;
            color: #667eea;
            font-size: 15px;
        }
    </style>
</head>
<body>
    
    <div class="login-card">
        <h2>Login</h2>
        <form onsubmit="return validateLogin()">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password">
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input">
                <label class="form-check-label">Remember me</label>
            </div>

            <div class="d-grid">
                <input type="submit" class="btn btn-login" value="Login">
            </div>

            <div class="links">
                <a href="#">Forgot Password?</a><br>
                <span>New user? <a href="register.html">Register</a></span>
            </div>

        </form>
    </div>

    <script>
        function validateLogin() {
            let username = document.getElementById("username").value.trim();
            let password = document.getElementById("password").value.trim();

            if(username === "" || password === "") {
                alert("⚠ Please fill all fields!");
                return false;
            }
            else if(password.length < 6) {
                alert("⚠ Password must be at least 6 characters!");
                return false;
            }
            else {
                let successSound = new Audio("audios/sound2.mp3");
                
                successSound.play();
                setTimeout(function(){
                    window.location.href = "index.html";
                }, 2000);

                return false;
            }
        }
    </script>

</body>
</html>
