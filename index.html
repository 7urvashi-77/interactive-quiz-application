<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Welcome</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<style>
    body 
    {
        background-image: url("images/quizbg4.jpg");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
    }
    .overlay 
    {
        background: #d4afe299;
        min-height: 100vh;
    }
    .welcome-box 
    {
        background: pink;
        border-radius: 35px;
        animation: fadeUp 3s ease both;
    }
    .img 
    {
        max-width: 100%;
        animation: zoomIn 1.2s ease forwards;
    }
    @keyframes zoomIn 
    {
        from {
            opacity: 0;
            transform: scale(0.85);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }
    .action-btn 
    {
        font-size: 20px;
        padding: 10px 25px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    .action-btn:hover 
    {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(10, 94, 239, 0.3);
    }
    .social-btn img {
        margin-right: 10px;
    }
    .action-btn, .social-btn {
        border-radius: 10px;
    }
</style>
</head>

<body>
    <script>
            $(document).ready(function(){
                $(".welcome-box").hide().fadeIn(1200);
            });
    </script>
    <script>
        $(document).ready(function(){
            $(".list-group-item").hover(function(){
                $(this).stop().animate({paddingLeft: "30px"}, 200);
            },
            function(){
                $(this).stop().animate({paddingLeft: "15px"}, 200);
            }
        );
        })
    </script>
    <script>
        $(document).ready(function(){
            var text = "Welcome to Caps On";
            var i = 0;
            function typing(){
                if(i < text.length){
                    $(".fade-text.delay-1").text($(".fade-text.delay-1").text() + text.charAt(i));
                    i++;
                    setTimeout(typing, 50);
                }
            }
            $(".fade-text.delay-1").text("");
            typing();
        });
    </script>
    <script>
        $(window).scroll(function(){
            $(".fade-text").each(function(){
                var pos = $(this).offset().top;
                var winTop = $(window).scrollTop() + $(window).height();
                if(pos < winTop){
                    $(this).addClass("animate__animated animate__fadeInUp");
                }
            });
        });
    </script>
    <div class="overlay">
        <nav class="navbar navbar-expand-lg navbar-dark bg-info px-3">
        <img src="images/logo1.jpg" style="width: 75px;" height="85px">
        <h2 class="navbar-nav fw-bold" style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Thinking Caps On</h2>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="about.html" style="font-size: 20px;">About</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html" style="font-size: 20px;">Contact Us</a></li>
            </ul>
        </div>
        </nav>
        <div class="container d-flex align-items-center justify-content-center min-vh-100">
            <div class="row welcome-box shadow-lg p-5 w-100">
                <div class="col-md-6 d-flex flex-column justify-content-center">
                    <h1 class="fw-bold fade-text delay-1" style="font-size: 50px; font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif">
                        Welcome to Caps On
                    </h1>
                    <p class="text-muted fade-text delay-2" style="font-size: 20px;">
                        Test your programming skills with interactive quizzes.
                        Improve your knowledge and track your progress.
                    </p><br>
                    <ul class="list-group mb-4 fade-text delay-3">
                        <li class="list-group-item" style="font-size: 20px;">📚 Multiple Choice Questions</li>
                        <li class="list-group-item" style="font-size: 20px;">⏱ Timed Quiz</li>
                        <li class="list-group-item" style="font-size: 20px;">🏆 Instant Result</li>
                    </ul><br><br>
                    <div class="d-flex gap-1 fade-text delay-3" style="margin-left: 100px;">
                        <div class="fade-text delay-3">
                            <div class="d-flex mb-3">
                                <a href="login.html" class="btn btn-primary action-btn">Login</a>
                                <a href="register.html" class="btn btn-outline-primary action-btn">Sign Up</a>
                            </div>
                            <div class="text-center mb-3">
                                <span style="color: gray;">──────── or ────────</span>
                            </div>
                            <div class="d-grid gap-2">
                                <button class="btn btn-light border social-btn" id="googleBtn">
                                    <img src="https://img.icons8.com/color/20/google-logo.png"/>Continue with Google
                                </button>
                                <button class="btn btn-light border social-btn" id="facebookBtn">
                                    <img src="https://img.icons8.com/color/20/facebook.png"/>Continue with Facebook
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 text-center d-none d-md-block">
                    <img src="images/welcome.jpg" class="img" alt="Quiz Illustration">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
