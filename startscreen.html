<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Start Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .video-background video {
            position: fixed; 
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1; 
            object-fit: cover; 
        }
        .video-background::after {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            z-index: -1;
        }
    </style>
    </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <header>
        
        <nav class="navbar navbar-light bg-light">
            <div class="container-fluid">
                 
                <button data-bs-toggle="offcanvas" data-bs-target="#sidebar"><img src="images/setting.jpg" alt="settings" width="50"> </button>
                <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebar">
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title">Settings</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
                    </div>
                    <div class="offcanvas-body p-0">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">Profile</li>
                            <li class="list-group-item">Account</li>
                            <li class="list-group-item">Notifications</li>
                            <li class="list-group-item">Privacy</li>
                            <li class="list-group-item">Logout</li>
                        </ul>
                    </div>
                </div>
                <div class="nav-center" style="padding: 15px;">Thinking Caps On</div>
                <a href="profile.html"><img src="images/profile.jpg" alt="profile" class="rounded-circle ms-auto" width="40"></a>
            </div>
        </nav>
    </header>
    <br>
    <br>
    <section class="hero text-center">
        <div class="hero-card shadow">
            <div class="video-background">
                <video autoplay muted loop playsinline poster="placeholder_image.jpg">
                    <source src="videos/bgvideo3.mp4" type="video/mp4">
                </video>
                <div class="d-flex justify-content-center"style="padding: 150px;">
                    <button class="btn btn-info px-2 rounded-pill"><a class="log" id="startBtn" href="#" style="padding: 50px;">Start Quiz</a></button>
                </div>
            </div>
        </div>
        <script>
            var params = window.location.search;
            document.getElementById("startBtn").href = "loader.html" + params;
        </script>
    </section>
<br>
<br>
<br>
<section class="cta text-center py-5">
    <button class="btn btn-light px-4 rounded-pill"><a class="log" href="subcat.html">Previous</a></button>

    <button class="btn btn-light px-4 rounded-pill" class="cta text-center py-5"><a class="log" href="#">Next</a></button>
</section>
<footer class="bg-secondary text-white text-center py-3">

</footer>
</body>
</html>
