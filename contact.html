<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Us</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
    body {
        background: linear-gradient(to right, #00c6ff, #f8a6ff);
        background-size: cover;
        background-repeat: no-repeat;
        min-height: 100vh;
        font-family: Arial, sans-serif;
    }

    .overlay {
        background: rgba(255, 255, 255, 0.35);
        min-height: 100vh;
    }

    .contact-box {
        background: pink;
        border-radius: 35px;
        padding: 40px;
        animation: fadeUp 1.2s ease both;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.2);
    }

    .contact-box h1 {
        font-size: 45px;
        font-weight: bold;
        text-align: center;
        color: #0dcaf0;
    }

    .contact-box p {
        text-align: center;
        font-size: 18px;
        color: #333;
    }

    .form-control {
        border-radius: 12px;
        font-size: 18px;
        padding: 12px;
    }

    .action-btn {
        font-size: 20px;
        padding: 10px 25px;
        border-radius: 15px;
        transition: 0.3s;
    }

    .action-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(10, 94, 239, 0.3);
    }

    .info-box {
        background: rgba(255, 255, 255, 0.7);
        border-radius: 18px;
        padding: 20px;
        font-size: 18px;
        color: #222;
        margin-top: 20px;
    }

    .social-icons a {
        font-size: 30px;
        margin: 0 12px;
        color: paleturquoise;
        transition: 0.3s;
        display:inline-block;
    }

    .social-icons a:hover {
        color: #0dcaf0;
        transform: scale(1.9);
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
</head>

<body>

<div class="overlay">

    <nav class="navbar navbar-expand-lg navbar-dark bg-info px-3">
        <img src="logo1.jpg" style="width: 75px;" height="85px">
        <h2 class="navbar-nav fw-bold" style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">
            Thinking Caps On
        </h2>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="welcome.html" style="font-size: 20px;">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html" style="font-size: 20px;">About</a></li>
            </ul>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="contact-box w-100" style="max-width: 850px;">

            <h1>Contact Us</h1>
            <p>
                If you have any questions, feedback, or support issues, feel free to contact us.
                We will reply as soon as possible!
            </p>

            <form>
                <div class="row mt-4">
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold">Full Name</label>
                        <input type="text" class="form-control" placeholder="Enter your name">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="fw-bold">Email</label>
                        <input type="email" class="form-control" placeholder="Enter your email">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="fw-bold">Subject</label>
                    <input type="text" class="form-control" placeholder="Enter subject">
                </div>

                <div class="mb-3">
                    <label class="fw-bold">Message</label>
                    <textarea class="form-control" rows="4" placeholder="Write your message here..."></textarea>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-primary action-btn" onclick="msg()">Send Message</button>
                    <a href="welcome.html" class="btn btn-outline-primary action-btn">Back</a>
                </div>
            </form>
            <script>
                function msg(){
                    confirm("✅ Message sent Successfully")
                }
            </script>
            <div class="info-box text-center">
                <p><b>📍 Address:</b> India</p>
                <p><b>📞 Phone:</b> +91 98765 43210</p>
                <p><b>📧 Email:</b> support@thinkingcapson.com</p>

                <div class="social-icons text-center mt-3">
                    <a href="#"><i class="bi bi-facebook"></i></a>
                    <a href="#"><i class="bi bi-instagram"></i></a>
                    <a href="#"><i class="bi bi-twitter-x"></i></a>
                    <a href="#"><i class="bi bi-linkedin"></i></a>
                    <a href="#"><i class="bi bi-youtube"></i></a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
