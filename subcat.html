<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz SubCategory Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .subcat{
            font-size: 40px; 
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
    </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <header>
        
        <nav class="navbar navbar-light bg-light">
            <div class="container-fluid">
                
                <button class="log" data-bs-toggle="offcanvas" data-bs-target="#sidebar"><img src="images/setting.jpg" alt="settings" width="50"> </button>
                <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebar">
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title">Settings</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
                    </div>
                    <div class="offcanvas-body p-0">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">Profile</li>
                            <li class="list-group-item">Account</li>
                            <li class="list-group-item">Notifications</li>
                            <li class="list-group-item">Privacy</li>
                            <li class="list-group-item">Logout</li>
                        </ul>
                    </div>
                </div>
                <div class="nav-center" style="padding: 15px;">Thinking Caps On</div>
                <a href="profile.html"><img src="images/profile.jpg" alt="profile" class="rounded-circle ms-auto" width="40"></a>
            </div>
        </nav>
    </header>


<section class="container my-5">
    <h1 class="text-center mb-5"><div style="color: lavenderblush; font-size: 50px;">Difficulty Level</div></h1>
    <br>
    <br>
    <div class="row justify-content-center g-5">
        <div class="col-md-9">
            <div id="easy" class="level bg-success text-center subcat">Easy</div>
        </div>
        <div class="col-md-9">
            <div id="medium" class="level bg-warning text-center subcat">Medium</div>
        </div>
        <div class="col-md-9">
            <div id="hard" class="level bg-danger text-center subcat">Hard</div>
        </div>
    </div>
</section>
<br>
<br>
<script>
    var params = new URLSearchParams(window.location.search);
    var cat = params.get("cat");

    document.getElementById("easy").onclick = function(){
        window.location.href = "loader.html?cat="+cat+"&level=easy";
    };

    document.getElementById("medium").onclick = function(){
        window.location.href = "loader.html?cat="+cat+"&level=medium";
    };

    document.getElementById("hard").onclick = function(){
        window.location.href = "loader.html?cat="+cat+"&level=hard";
    };
</script>

<section class="cta text-center py-5">
    <button class="btn btn-light px-4 rounded-pill"><a class="log" href="quizcategory.html">Previous</a></button>

    <button class="btn btn-light px-4 rounded-pill" class="cta text-center py-5"><a class="log" href="#">Next</a></button>
</section>
<footer class="bg-secondary text-white text-center py-3">
    &copy; 2026 QuizHub | All Rights Reserved
</footer>
</body>
</html>
