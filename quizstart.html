<style>
    body {
        background-image: url("images/quizbg4.jpg");
        background-size: cover;
    }
    .active-option {
        transform: scale(0.95);
        background-color: #e0f7fa;
    }
    .quiz-card {
        width: 90%;
        background: white;
        font-size: 20px;
        text-align: center;
    }
    .circle-timer{
        position:relative;
        width:80px;
        margin:auto;
    }
    .circle-timer span{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        font-weight:bold;
    }
    .list-group-item input[type="radio"] {
        display: none;
    }
    .list-group-item span {
        display: block;
        padding: 8px;
        border-radius: 5px;
        transition: all 0.3s ease;
        cursor: pointer;
    }
    .list-group-item span:hover {
        background-color: azure;
    }
    .shake{
        animation:shake 0.4s;
    }
    @keyframes shake{
        0%{transform:translateX(0)}
        25%{transform:translateX(-5px)}
        50%{transform:translateX(5px)}
        75%{transform:translateX(-5px)}
        100%{transform:translateX(0)}
    }
    .logo-img{
        width:180px;
        margin:10px;
    }
    .pressed {
        transform: scale(0.95);
    }
    .selected {
        border: 2px solid #0d6efd;
        background-color: #e8f0fe;
    }
</style>
</head>
<body>
    <script>
        function slideQuestion(){
            $("#questionBox").hide().slideDown(300);
        }
    </script>
    <script>
        function updateTimerColor(time){
            if(time <= 3){
                $("#circleTimer").css("transition","0.5s");
                $("#circleTimer").css("stroke","red");
            }
        }
    </script>
    <script>
        function updateProgress(){
            var percent = ((current+1)/questions.length)*100;
            $("#progressBar").css("width", percent + "%");

    </script>
    <script>
        function showLockMessage(){
            $("#lockMsg").fadeIn(200).delay(800).fadeOut(200);
        }
    </script>
    <script>
        $(document).on("click", "#options span", function(){
            $("#options span").removeClass("selected");
            $(this).addClass("selected");
        });
    </script>

                </div>

                        <circle cx="45" cy="45" r="40"
                            stroke="lightgray"
                            stroke-width="6"
                            fill="none"/>
                        <circle id="circleTimer"

                            cy="45"
                            r="40"
                            stroke="green"
                            stroke-width="6"
                            fill="none"
                            stroke-dasharray="251"

            <div id="lockMsg" class="text-success fw-bold text-center mt-2" style="display:none;">

            <div class="d-flex justify-content-between mt-4">

var current = 0;
var score = 0;
var time = 10;
var timer;
var userAnswers = new Array(questions.length).fill(0);

if(questions.length === 0){
    alert("Quiz data not found. Please start again.");
    window.location.href = "home.html";
}

function loadQuestion() {
    updateProgress();
    document.getElementById("qno").innerHTML = "Question " + (current + 1) + " of " + questions.length;
    document.getElementById("question").innerHTML = questions[current][0];

    var optionBox = document.getElementById("options");
    optionBox.innerHTML = "";
    for (var i = 1; i <= 4; i++) {
        var checked = (userAnswers[current] === i) ? "checked" : "";
        var disabled = (userAnswers[current] !== 0) ? "disabled" : "";
        var selectedClass = (userAnswers[current] === i) ? "selected" : "";
        optionBox.innerHTML +=
            "<label class='list-group-item'>" +
            "<input type='radio' name='opt' value='" + i + "' " + checked + " " + disabled + ">" +
            "<span class='" + selectedClass + "' onclick='selectAnswer(" + i + ")'>" + questions[current][i] + "</span>" +
            "</label>";
    }

    document.getElementById("prevBtn").disabled = (current === 0);
    document.getElementById("nextBtn").innerText = (current === questions.length - 1) ? "Submit" : "Next";

    var box = document.getElementById("questionBox");
    box.classList.add("fade");
    setTimeout(function(){
        box.classList.remove("fade");
    }, 500);

    startTimer();
    slideQuestion();
}

function startTimer() {
    clearInterval(timer);
    time = 10;
    var circle = document.getElementById("circleTimer");
    var text = document.getElementById("timeText");
    var sound = document.getElementById("timerSound");
    circle.style.strokeDashoffset = 0;
    circle.style.stroke = "green";
    sound.pause();
    sound.currentTime = 0;
    timer = setInterval(function(){
        time--;
        text.innerHTML = time;
        circle.style.strokeDashoffset = (10 - time) * 25;
        if(time <= 3){
            updateTimerColor(time);
            if(time == 3){
                sound.volume = 0.4;
                sound.play();
            }
        }
        if(time == 0){
            clearInterval(timer);
            sound.pause();
            sound.currentTime = 0;
            nextQuestion();
        }
    }, 1000);
}

function selectAnswer(selected) {
    if (userAnswers[current] !== 0) return;
    userAnswers[current] = selected;

    var optionSpans = document.querySelectorAll("#options span");
    for (var i = 0; i < optionSpans.length; i++) {
        optionSpans[i].classList.remove("selected");
    }
    optionSpans[selected - 1].classList.add("selected");

    var radios = document.getElementsByName("opt");
    for (var i = 0; i < radios.length; i++) {
        radios[i].disabled = true;
    }
    clearInterval(timer);
    showLockMessage();
}

function nextQuestion() {
    if (userAnswers[current] === 0) {
        alert("Please select an answer before proceeding.");
        return;
    }
    if (current < questions.length - 1) {
        current++;
        loadQuestion();
    } 
    else {
        score = 0;
        for (var i = 0; i < questions.length; i++) {
            if (userAnswers[i] === questions[i][5]) {
                score++;
            }
        }
        var reviewData = [];
        for (var i = 0; i < questions.length; i++) {
            reviewData.push({
                q: questions[i][0],       
                o1: questions[i][1],      
                o2: questions[i][2],      
                o3: questions[i][3],      
                o4: questions[i][4],      
                correct: questions[i][5], 
                given: userAnswers[i]  
            });
        }
        localStorage.setItem("lastReview", JSON.stringify(reviewData));

        window.location.href = "result.html?score=" + score + "&total=" + questions.length + "&cat=" + category + "&level=" + level;
    }
}

function prevQuestion() {
    if (current > 0) {
        current--;
        loadQuestion();
    }
}

</script>
