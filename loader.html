<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quiz Loading...</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: plum;
    font-family: Arial, sans-serif;
}

.loader-card {
    width: 100%;
    background: peachpuff;
    padding: 60px 60px;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.1);
    text-align: center;
}

.quiz-title {
    font-size: 24px;
    font-weight: bold;
    color: peru;
    margin-bottom: 20px;
}


.loader {
    width: 50px;
    height: 50px;
    border: 6px solid gainsboro;
    border-top: 6px double rosybrown;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: auto;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.loading-text {
    margin-top: 15px;
    font-size: 18px;
    color: #555;
}
</style>
</head>
<body>
    <header>
        <nav class="navbar navbar-light bg-light">
            <div class="container-fluid">
                <div class="nav-center" style="padding: 15px; font-weight: bold;
            border :dashed;
            border-radius: 20px;
            color: darkorchid;
            background-color: lavender;">Thinking Caps On</div>
            </div> 
        </nav>
    </header>
<div class="loader-card">
    <div class="quiz-title">Programming Quiz</div>
    <div class="loader"></div>
    <div class="loading-text">Loading Questions...</div>
</div>
<script>
    var params = window.location.search;
    var alreadyLoaded = sessionStorage.getItem("quizLoaded_" + params);
 
    if(alreadyLoaded){
        window.location.href = "quizstart.html" + params;
    } else {
        setTimeout(function(){
            window.location.href = "quizstart.html" + params;
        }, 3000);
    }
</script>

</body>
</html>
